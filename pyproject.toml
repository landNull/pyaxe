[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaxe"
version = "0.1.0"
description = "Python Swiss army knife for Python code. Syntax, pattern, style, dependency, and safety checks with safe local healing."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "pyaxe contributors"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
pyaxe = "pyaxe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
